spring.application.name=ibom-api

spring.datasource.url=jdbc:mysql://localhost:3306/ibom?serverTimezone=UTC
spring.datasource.username=ibom_user
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.auth.jwt.secret=ibom-development-access-token-signing-key-change-before-production
app.auth.jwt.access-token-ttl-seconds=900
app.auth.refresh-token-ttl-seconds=604800
