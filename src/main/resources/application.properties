spring.application.name=ibom-api
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ibom?serverTimezone=UTC
spring.datasource.username=${IBOM_USERNAME}
spring.datasource.password=${IBOM_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.auth.jwt.secret=${IBOM_JWT_SECRET}
app.auth.jwt.access-token-ttl-seconds=900
app.auth.refresh-token-ttl-seconds=604800
